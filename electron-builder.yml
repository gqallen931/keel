appId: com.example.desktop-framework
productName: Desktop Framework
copyright: Copyright © 2026 SCS Framework

directories:
  output: release
  buildResources: build

# 渲染层由 vite 打进 out/renderer，运行期仅需 main/preload 与外部 node 依赖
files:
  - out/**/*
  - package.json

asar: true
npmRebuild: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Desktop Framework
  artifactName: ${productName}-${version}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}

publish: null
